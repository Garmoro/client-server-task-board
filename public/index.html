<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Учебное клиент-серверное приложение Task Board" />
    <title>Task Board — клиент-серверная механика</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">CLIENT / SERVER LAB 01</p>
        <h1>Идея превращается<br /><em>в работающий запрос.</em></h1>
        <p class="intro">Небольшая доска задач, чтобы увидеть весь путь данных: от клика в браузере до записи на сервере и обратно.</p>
        <div class="pipeline" aria-label="Путь данных">
          <span>браузер</span><b>→</b><span>HTTP</span><b>→</b><span>Node.js</span><b>→</b><span>JSON</span>
        </div>
      </section>

      <section class="board" aria-labelledby="board-title">
        <div class="board-head">
          <div>
            <p class="kicker">ПРАКТИКА</p>
            <h2 id="board-title">Мои задачи</h2>
          </div>
          <span id="counter" class="counter">загрузка...</span>
        </div>
        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-title">Название задачи</label>
          <input id="task-title" name="title" maxlength="120" placeholder="Например: проверить POST в DevTools" autocomplete="off" required />
          <button type="submit">Добавить</button>
        </form>
        <p id="notice" class="notice" role="status"></p>
        <ul id="task-list" class="task-list" aria-live="polite"></ul>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
